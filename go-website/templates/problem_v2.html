{% extends "base.html" %}
{% block title %}第 {{ level }} 关 · 第 {{ n }} 题 - 围棋入门{% endblock %}
{% block content %}
<section class="article problem-page">
  <h1 id="prob-title">第 {{ level }} 关 · 第 {{ n }} / {{ total }} 题</h1>
  <p class="problem-meta" id="prob-meta">{{ p.name }} · 题目黑棋，你执白棋 · 单击落子并提交</p>

  <div class="board-wrap">
    <svg id="goban" viewBox="0 0 400 400" xmlns="http://www.w3.org/2000/svg">
      <defs>
        <linearGradient id="wood" x1="0" y1="0" x2="1" y2="1">
          <stop offset="0" stop-color="#f0c674" />
          <stop offset="0.5" stop-color="#e0a84f" />
          <stop offset="1" stop-color="#ca8d3b" />
        </linearGradient>
        <radialGradient id="blackStoneGrad" cx="32%" cy="28%" r="80%">
          <stop offset="0" stop-color="#9a9a9a" />
          <stop offset="0.15" stop-color="#555555" />
          <stop offset="0.5" stop-color="#1e1e1e" />
          <stop offset="0.88" stop-color="#050505" />
          <stop offset="1" stop-color="#3a3a3a" />
        </radialGradient>
        <radialGradient id="whiteStoneGrad" cx="32%" cy="28%" r="82%">
          <stop offset="0" stop-color="#ffffff" />
          <stop offset="0.55" stop-color="#f8f6f2" />
          <stop offset="0.85" stop-color="#dcd6ca" />
          <stop offset="1" stop-color="#b3ab9c" />
        </radialGradient>
        <filter id="stoneShadow" x="-40%" y="-40%" width="180%" height="180%">
          <feGaussianBlur in="SourceAlpha" stdDeviation="2.6" />
          <feOffset dx="0" dy="3.2" />
          <feComponentTransfer>
            <feFuncA type="linear" slope="0.5" />
          </feComponentTransfer>
          <feMerge>
            <feMergeNode />
            <feMergeNode in="SourceGraphic" />
          </feMerge>
        </filter>
      </defs>

      <rect x="20" y="20" width="360" height="360" rx="8" fill="url(#wood)" />
      <image href="{{ url_for('static', filename='board.png') }}" x="20" y="20" width="360" height="360" preserveAspectRatio="xMidYMid slice" />

      {% for i in range(9) %}
        <line x1="40" y1="{{ 40 + i * 40 }}" x2="360" y2="{{ 40 + i * 40 }}" class="grid-line" />
        <line x1="{{ 40 + i * 40 }}" y1="40" x2="{{ 40 + i * 40 }}" y2="360" class="grid-line" />
      {% endfor %}

      <!-- 坐标标注：列 A-I（上）、行 1-9（左），尽量靠外 -->
      {% for c in range(9) %}
        {% set col = 'ABCDEFGHI'[c] %}
        <text x="{{ 40 + c * 40 }}" y="18" text-anchor="middle" font-size="11" fill="#6b4a26" font-weight="bold">{{ col }}</text>
      {% endfor %}
      {% for r in range(9) %}
        <text x="11" y="{{ 40 + r * 40 }}" text-anchor="middle" dominant-baseline="central" font-size="11" fill="#6b4a26" font-weight="bold">{{ r + 1 }}</text>
      {% endfor %}

      {% for sr, sc in [(2,2),(2,6),(6,2),(6,6),(4,4)] %}
        <circle cx="{{ 40 + sc * 40 }}" cy="{{ 40 + sr * 40 }}" r="3.5" fill="#4a3a22" />
      {% endfor %}

      <!-- 棋子层（JS 动态渲染，支持无刷新切换下一题） -->
      <g id="stones"></g>
    </svg>
  </div>

  <div class="problem-actions">
    <button type="button" id="submit-btn">提交判断</button>
    <button type="button" id="hint-btn">💡 提示</button>
    <button type="button" id="reset-btn">重来</button>
    <a id="page-next-btn" class="page-next hidden" href="#">下一题</a>
  </div>

  <nav class="problem-nav">
    {% if prev_n %}
      <a href="{{ url_for('problem', n=prev_n) }}">← 上一题</a>
    {% endif %}
    <a href="{{ url_for('problems') }}">关卡列表</a>
  </nav>
</section>

<div id="modal-overlay" class="modal-overlay hidden">
  <div id="modal-box" class="modal-box">
    <h2 id="modal-title"></h2>
    <p id="modal-message"></p>
    <a id="modal-next-btn" class="modal-next hidden" href="#">下一题</a>
    <button id="modal-close-btn" type="button">关闭</button>
  </div>
</div>

<script>
  let PROBLEM_N = {{ n }};
  let VITAL = {{ p.vital | tojson }};
  const INITIAL_BOARD = {{ p.board | tojson }};
  const TOTAL = {{ total }};
  const SVG_NS = 'http://www.w3.org/2000/svg';

  let selected = null;       // {r, c, group}
  let solved = false;
  let submitting = false;
  let loadingProblem = false;

  const modalOverlay = document.getElementById('modal-overlay');
  const modalBox = document.getElementById('modal-box');
  const modalTitle = document.getElementById('modal-title');
  const modalMessage = document.getElementById('modal-message');
  const modalNextBtn = document.getElementById('modal-next-btn');
  const modalCloseBtn = document.getElementById('modal-close-btn');
  const pageNextBtn = document.getElementById('page-next-btn');

  // ---- 棋盘渲染（JS 动态，支持无刷新切换） ----
  function renderStones(board) {
    const stones = document.getElementById('stones');
    stones.innerHTML = '';
    const frag = document.createDocumentFragment();
    for (let r = 0; r < 9; r++) {
      for (let c = 0; c < 9; c++) {
        const ch = board[r][c];
        const cx = 40 + c * 40, cy = 40 + r * 40;
        if (ch === 'B' || ch === 'W') {
          const g = document.createElementNS(SVG_NS, 'g');
          g.setAttribute('class', 'placed-stone');
          const stone = document.createElementNS(SVG_NS, 'circle');
          stone.setAttribute('class', 'stone ' + (ch === 'B' ? 'black-stone' : 'white-stone'));
          stone.setAttribute('cx', cx);
          stone.setAttribute('cy', cy);
          stone.setAttribute('r', 17);
          stone.setAttribute('filter', 'url(#stoneShadow)');
          g.appendChild(stone);
          frag.appendChild(g);
        } else {
          const g = document.createElementNS(SVG_NS, 'g');
          g.setAttribute('class', 'hit-point');
          g.setAttribute('data-r', r);
          g.setAttribute('data-c', c);
          const hc = document.createElementNS(SVG_NS, 'circle');
          hc.setAttribute('class', 'hit-circle');
          hc.setAttribute('cx', cx);
          hc.setAttribute('cy', cy);
          hc.setAttribute('r', 18);
          g.appendChild(hc);
          frag.appendChild(g);
        }
      }
    }
    stones.appendChild(frag);
  }

  // ---- 无刷新切换下一题 ----
  async function goProblem(n) {
    if (loadingProblem) return;
    loadingProblem = true;
    try {
      const resp = await fetch('/api/problem/' + n);
      const data = await resp.json();
      PROBLEM_N = n;
      VITAL = data.vital;
      solved = false;
      submitting = false;
      clearSelected();
      clearHints();
      hideModal();
      renderStones(data.board);
      const level = Math.floor((n - 1) / 5) + 1;
      document.getElementById('prob-title').textContent = '第 ' + level + ' 关 · 第 ' + n + ' / ' + TOTAL + ' 题';
      document.getElementById('prob-meta').textContent = data.name + ' · 题目黑棋，你执白棋 · 单击落子并提交';
      document.title = '第 ' + level + ' 关 · 第 ' + n + ' 题 - 围棋入门';
      history.pushState(null, '', '/problem/' + n);
    } catch (err) {
      window.location.href = '/problem/' + n;
    } finally {
      loadingProblem = false;
    }
  }

  function bindNextLink(el) {
    if (!el) return;
    el.addEventListener('click', function (e) {
      const href = el.getAttribute('href') || '';
      const m = href.match(/^\/problem\/(\d+)$/);
      if (m) {
        e.preventDefault();
        goProblem(parseInt(m[1], 10));
      }
    });
  }
  bindNextLink(modalNextBtn);
  bindNextLink(pageNextBtn);

  // 初始渲染
  renderStones(INITIAL_BOARD);

  // ---- 落子音效 ----
  const placeAudio = new Audio('/static/sound/place.wav?v=15');
  placeAudio.volume = 1.0;
  placeAudio.preload = 'auto';
  function playPlaceSound() {
    try {
      placeAudio.currentTime = 0;
      placeAudio.play().catch(function () {});
    } catch (err) { /* 忽略自动播放限制 */ }
  }

  function makeUserStone(cx, cy) {
    const g = document.createElementNS(SVG_NS, 'g');
    g.setAttribute('pointer-events', 'none');
    const stone = document.createElementNS(SVG_NS, 'circle');
    stone.setAttribute('class', 'stone white-stone preview');
    stone.setAttribute('cx', cx);
    stone.setAttribute('cy', cy);
    stone.setAttribute('r', 17);
    stone.setAttribute('filter', 'url(#stoneShadow)');
    g.appendChild(stone);
    return g;
  }

  function placeStone(r, c) {
    clearSelected();
    removeHintAt(r, c);
    const group = makeUserStone(40 + c * 40, 40 + r * 40);
    document.getElementById('goban').appendChild(group);
    selected = {r, c, group};
    playPlaceSound();
  }

  function clearSelected() {
    if (selected && selected.group) {
      selected.group.remove();
    }
    selected = null;
  }

  function resetAll() {
    clearSelected();
    clearHints();
    solved = false;
    submitting = false;
    document.getElementById('submit-btn').disabled = false;
    hideModal();
  }

  // ---- 提示功能 ----
  const hintBtn = document.getElementById('hint-btn');
  let hints = [];

  function renderHints() {
    clearHints();
    for (const pt of VITAL) {
      const r = pt[0], c = pt[1];
      const cx = 40 + c * 40, cy = 40 + r * 40;
      const g = document.createElementNS(SVG_NS, 'g');
      g.setAttribute('class', 'hint-stone');
      g.setAttribute('data-hint-r', r);
      g.setAttribute('data-hint-c', c);
      const body = document.createElementNS(SVG_NS, 'circle');
      body.setAttribute('class', 'stone-hint-body');
      body.setAttribute('cx', cx);
      body.setAttribute('cy', cy);
      body.setAttribute('r', 17);
      const core = document.createElementNS(SVG_NS, 'circle');
      core.setAttribute('class', 'stone-hint-core');
      core.setAttribute('cx', cx);
      core.setAttribute('cy', cy);
      core.setAttribute('r', 6);
      g.appendChild(body);
      g.appendChild(core);
      goban.appendChild(g);
      hints.push({r: r, c: c, group: g});
    }
  }

  function clearHints() {
    for (const h of hints) h.group.remove();
    hints = [];
  }

  function removeHintAt(r, c) {
    const idx = hints.findIndex(h => h.r === r && h.c === c);
    if (idx >= 0) {
      hints[idx].group.remove();
      hints.splice(idx, 1);
    }
  }

  hintBtn.addEventListener('click', function () {
    if (solved || submitting) return;
    if (hints.length) {
      clearHints();
    } else {
      renderHints();
    }
  });

  function showModal(title, message, nextUrl, nextText) {
    modalTitle.textContent = title;
    if (message) {
      modalMessage.textContent = message;
      modalMessage.classList.remove('hidden');
    } else {
      modalMessage.textContent = '';
      modalMessage.classList.add('hidden');
    }
    if (nextUrl) {
      modalNextBtn.href = nextUrl;
      modalNextBtn.textContent = nextText || '下一题';
      modalNextBtn.classList.remove('hidden');
      pageNextBtn.href = nextUrl;
      pageNextBtn.textContent = nextText || '下一题';
      pageNextBtn.classList.remove('hidden');
    } else {
      modalNextBtn.classList.add('hidden');
    }
    modalOverlay.classList.remove('hidden');
  }

  function hideModal() {
    modalOverlay.classList.add('hidden');
  }

  async function submitMove() {
    if (!selected || solved || submitting) return;
    submitting = true;
    document.getElementById('submit-btn').disabled = true;

    const r = selected.r, c = selected.c;
    // 本地即时判断（VITAL 已在页面内），弹窗零延迟，不等网络
    const correct = VITAL.some(function (pt) { return pt[0] === r && pt[1] === c; });

    if (correct) {
      solved = true;
      clearHints();
      const stone = selected.group.querySelector('.white-stone');
      stone.classList.remove('preview');
      stone.classList.add('correct');

      let nextUrl = '{{ url_for("problems") }}';
      let nextText = '返回关卡';
      if (PROBLEM_N < {{ total }}) {
        nextUrl = '/problem/' + (PROBLEM_N + 1);
        nextText = '下一题';
      }

      showModal('恭喜你，答对了', '', nextUrl, nextText);
    } else {
      clearSelected();
      showModal('答错了', '请重新落子，再试一次。');
      document.getElementById('submit-btn').disabled = false;
    }

    submitting = false;

    // 后台同步通关进度到服务器（不阻塞弹窗显示）
    try {
      await fetch('/api/problem/' + PROBLEM_N + '/check', {
        method: 'POST',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify({r: r, c: c})
      });
    } catch (err) { /* 进度同步失败不影响本次体验 */ }
  }

  const goban = document.getElementById('goban');

  function hitPointFromEvent(e) {
    const el = e.target.closest ? e.target.closest('.hit-point') : null;
    if (!el || !goban.contains(el)) return null;
    return {
      r: parseInt(el.dataset.r, 10),
      c: parseInt(el.dataset.c, 10)
    };
  }

  // 单击落子并立即提交
  goban.addEventListener('click', function (e) {
    const point = hitPointFromEvent(e);
    if (!point || solved || submitting || !modalOverlay.classList.contains('hidden')) return;
    placeStone(point.r, point.c);
    submitMove();
  });

  document.getElementById('reset-btn').addEventListener('click', resetAll);
  document.getElementById('submit-btn').addEventListener('click', submitMove);
  modalCloseBtn.addEventListener('click', hideModal);
  modalOverlay.addEventListener('click', function (e) {
    if (e.target === modalOverlay && !solved) {
      hideModal();
    }
  });

  // ---- 空格键快捷键：答对弹窗中触发"下一题" ----
  window.addEventListener('keydown', function (e) {
    if (e.code !== 'Space') return;
    // 焦点在按钮/链接/输入框上时不拦截（避免双重触发）
    const t = e.target;
    if (t && (t.tagName === 'BUTTON' || t.tagName === 'A' || t.tagName === 'INPUT' || t.tagName === 'TEXTAREA')) return;
    // 仅当弹窗可见且"下一题"按钮显示时生效
    if (!modalOverlay.classList.contains('hidden') && !modalNextBtn.classList.contains('hidden')) {
      e.preventDefault();
      modalNextBtn.click();
    }
  });
</script>
{% endblock %}
