{% extends "base.html" %}
{% block title %}围棋入门 - 首页{% endblock %}
{% block content %}
<section class="hero">
  <h1>围棋入门学习</h1>
  <p>从规则、提子和气开始，再通过 200 关死活题闯关练手。</p>
  <a class="primary-button" href="{{ url_for('problems') }}">开始闯关</a>
</section>

<section class="cards">
  {% for a in articles %}
  <article class="card">
    <h2>{{ a.title }}</h2>
    <p>{{ a.summary }}</p>
    <a href="{{ url_for('article', slug=a.slug) }}">阅读全文 →</a>
  </article>
  {% endfor %}
</section>
{% endblock %}
